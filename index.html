<!--
  =================================================================
  WEATHER SCHEDULE -- single-file PWA
  =================================================================
  Everything (HTML, CSS, JS, manifest, icon) lives in this one file.

  SETUP -- the only thing you need to do:
  Get a free Google OAuth Client ID (about 3 minutes) so the app can
  read your calendar, then paste it into GOOGLE_CLIENT_ID below.

    1. Go to https://console.cloud.google.com/ and create a project
       (or use an existing one).
    2. Search for "Google Calendar API" and click Enable.
    3. Go to APIs & Services -> OAuth consent screen. Fill in the
       required fields (app name, your email) and save. If it's in
       "Testing" mode, add your own Google account under Test users.
    4. Go to APIs & Services -> Credentials -> Create Credentials ->
       OAuth client ID.
         - Application type: Web application
         - Authorized JavaScript origins: add the exact origin
           you'll load this file from, e.g. http://localhost:5500
           or https://yourname.github.io (no trailing slash, no path)
    5. Copy the Client ID (ends in .apps.googleusercontent.com) and
       paste it into the GOOGLE_CLIENT_ID line inside the <script>
       block near the bottom of this file.

  Weather needs no setup at all -- it uses Open-Meteo, which is free
  and keyless.

  Serve this file over http:// or https:// (not double-clicked as a
  file:// path) so Google sign-in and geolocation work, e.g.:
      python3 -m http.server 5500
  then open http://localhost:5500/index.html
  =================================================================
-->

<style>
:root {
  --paper: #F3F5F6;
  --paper-alt: #EAEDEE;
  --ink: #1B2733;
  --ink-soft: #5B6B78;
  --line: #D7DCE0;
  --amber: #E8A33D;
  --amber-soft: #FBEEDA;
  --blue: #4C7A96;
  --radius: 10px;

  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-data: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

html, body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

/* ---------- Header ---------- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  background: var(--ink);
  color: var(--paper);
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  flex: none;
  background: var(--amber);
  background-image: radial-gradient(circle at 34% 36%, rgba(255,255,255,0.55) 0 4px, transparent 5px);
}

.brand-text h1 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.date-line {
  margin: 2px 0 0;
  font-size: 0.82rem;
  color: #B7C2CA;
  font-variant-numeric: tabular-nums;
}

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  font: inherit;
  font-size: 0.86rem;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 7px;
  border: 1px solid transparent;
  cursor: pointer;
}

.btn-primary {
  background: var(--amber);
  color: #201202;
}
.btn-primary:hover { filter: brightness(1.05); }
.btn-primary:disabled { opacity: 0.55; cursor: default; }

.btn-quiet {
  background: transparent;
  border-color: #3C4C59;
  color: var(--paper);
}
.btn-quiet:hover { background: #24333F; }

.account-badge {
  font-size: 0.8rem;
  color: #B7C2CA;
}

/* ---------- Status ---------- */

.status-bar {
  padding: 0 20px;
  font-size: 0.85rem;
  color: var(--ink-soft);
  min-height: 0;
}
.status-bar:not(:empty) {
  padding-top: 12px;
  padding-bottom: 4px;
}
.status-bar.error { color: #A83A3A; }

/* ---------- Schedule ---------- */

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px 20px 40px;
}

.schedule-wrap {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: #fff;
}

.schedule-header,
.row {
  display: grid;
  grid-template-columns: 84px 150px 1fr;
  align-items: center;
}

.schedule-header {
  padding: 10px 16px;
  background: var(--paper-alt);
  border-bottom: 1px solid var(--line);
  font-size: 0.78rem;
  color: var(--ink-soft);
  font-weight: 600;
}

.schedule-body .row {
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  min-height: 52px;
}
.schedule-body .row:last-child { border-bottom: none; }
.schedule-body .row:nth-child(even) { background: #FBFCFC; }

.row.is-now {
  background: var(--amber-soft);
  box-shadow: inset 3px 0 0 var(--amber);
}

.row.is-past { opacity: 0.55; }

.col-time {
  font-family: var(--font-data);
  font-variant-numeric: tabular-nums;
  font-size: 0.92rem;
  color: var(--ink);
}

.col-weather {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--font-data);
  font-variant-numeric: tabular-nums;
}
.weather-icon { font-size: 1.15rem; font-family: var(--font-body); }
.weather-temp { font-size: 0.92rem; }
.weather-desc {
  font-family: var(--font-body);
  font-size: 0.78rem;
  color: var(--ink-soft);
}
.weather-cell-inner { display: flex; flex-direction: column; gap: 1px; }
.weather-cell-top { display: flex; align-items: baseline; gap: 8px; }

.col-calendar {
  font-size: 0.9rem;
  line-height: 1.35;
}

.event {
  display: block;
  padding: 2px 0;
}
.event + .event { margin-top: 2px; }
.event-time {
  font-family: var(--font-data);
  font-size: 0.72rem;
  color: var(--blue);
  margin-right: 6px;
}
.event-title { color: var(--ink); }

.empty-slot {
  color: #A7B0B8;
}

/* ---------- Footer ---------- */

.foot {
  text-align: center;
  padding: 18px;
  font-size: 0.78rem;
  color: var(--ink-soft);
}

/* ---------- Responsive ---------- */

@media (max-width: 640px) {
  .schedule-header,
  .row {
    grid-template-columns: 62px 96px 1fr;
  }
  .weather-desc { display: none; }
  .topbar { padding: 14px 16px; }
}

</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <h1>Weather Schedule</h1>
      <p id="dateLine" class="date-line">&nbsp;</p>
    </div>
  </div>

  <div class="controls">
    <button id="locateBtn" class="btn btn-quiet" type="button">Set location</button>
    <button id="signInBtn" class="btn btn-primary" type="button">Connect calendar</button>
    <span id="accountBadge" class="account-badge" hidden></span>
  </div>
</header>

<div id="statusBar" class="status-bar" role="status" aria-live="polite"></div>

<main>
  <div class="schedule-wrap">
    <div class="schedule-header" aria-hidden="true">
      <span class="col-time">Time</span>
      <span class="col-weather">Weather</span>
      <span class="col-calendar">Calendar</span>
    </div>
    <div id="scheduleBody" class="schedule-body">
      <!-- hour rows injected here -->
    </div>
  </div>
</main>

<footer class="foot">
  <p>Weather from Open-Meteo &middot; Calendar from your Google account, read-only</p>
</footer>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CONFIG = {
  // Paste your Google OAuth Client ID here (see the "Google setup" comment
  // block right below) -- everything else in this file can stay as-is.
  GOOGLE_CLIENT_ID: "YOUR_CLIENT_ID.apps.googleusercontent.com",
  GOOGLE_SCOPE: "https://www.googleapis.com/auth/calendar.readonly",
  CALENDAR_ID: "primary",
};

// =================================================================
// Weather Schedule — app logic
// =================================================================

const els = {
  dateLine: document.getElementById("dateLine"),
  statusBar: document.getElementById("statusBar"),
  scheduleBody: document.getElementById("scheduleBody"),
  locateBtn: document.getElementById("locateBtn"),
  signInBtn: document.getElementById("signInBtn"),
  accountBadge: document.getElementById("accountBadge"),
};

const state = {
  latitude: null,
  longitude: null,
  placeName: null,
  weatherByHour: {},     // { 0: {temp, code}, 1: {...}, ... }
  eventsByHour: {},      // { 0: [ {title, startLabel, allDay} ], ... }
  allDayEvents: [],
  accessToken: null,
  tokenClient: null,
};

const WMO = {
  0:  ["\u2600\uFE0F", "Clear sky"],
  1:  ["\uD83C\uDF24\uFE0F", "Mostly clear"],
  2:  ["\u26C5", "Partly cloudy"],
  3:  ["\u2601\uFE0F", "Overcast"],
  45: ["\uD83C\uDF2B\uFE0F", "Fog"],
  48: ["\uD83C\uDF2B\uFE0F", "Rime fog"],
  51: ["\uD83C\uDF26\uFE0F", "Light drizzle"],
  53: ["\uD83C\uDF26\uFE0F", "Drizzle"],
  55: ["\uD83C\uDF27\uFE0F", "Dense drizzle"],
  56: ["\uD83C\uDF27\uFE0F", "Freezing drizzle"],
  57: ["\uD83C\uDF27\uFE0F", "Freezing drizzle"],
  61: ["\uD83C\uDF27\uFE0F", "Light rain"],
  63: ["\uD83C\uDF27\uFE0F", "Rain"],
  65: ["\uD83C\uDF27\uFE0F", "Heavy rain"],
  66: ["\uD83C\uDF27\uFE0F", "Freezing rain"],
  67: ["\uD83C\uDF27\uFE0F", "Freezing rain"],
  71: ["\uD83C\uDF28\uFE0F", "Light snow"],
  73: ["\uD83C\uDF28\uFE0F", "Snow"],
  75: ["\uD83C\uDF28\uFE0F", "Heavy snow"],
  77: ["\uD83C\uDF28\uFE0F", "Snow grains"],
  80: ["\uD83C\uDF26\uFE0F", "Rain showers"],
  81: ["\uD83C\uDF26\uFE0F", "Rain showers"],
  82: ["\u26C8\uFE0F", "Violent showers"],
  85: ["\uD83C\uDF28\uFE0F", "Snow showers"],
  86: ["\uD83C\uDF28\uFE0F", "Snow showers"],
  95: ["\u26C8\uFE0F", "Thunderstorm"],
  96: ["\u26C8\uFE0F", "Thunderstorm, hail"],
  99: ["\u26C8\uFE0F", "Thunderstorm, hail"],
};

function setStatus(msg, isError) {
  els.statusBar.textContent = msg || "";
  els.statusBar.classList.toggle("error", !!isError);
}

function pad2(n) { return String(n).padStart(2, "0"); }

function hourLabel(h) {
  const period = h < 12 ? "AM" : "PM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:00 ${period}`;
}

// ---------------- Skeleton render ----------------

function buildSkeleton() {
  els.scheduleBody.innerHTML = "";
  const now = new Date();
  const currentHour = now.getHours();

  for (let h = 0; h < 24; h++) {
    const row = document.createElement("div");
    row.className = "row";
    row.id = `row-${h}`;
    if (h === currentHour) row.classList.add("is-now");
    else if (h < currentHour) row.classList.add("is-past");

    row.innerHTML = `
      <span class="col-time">${hourLabel(h)}</span>
      <span class="col-weather" id="weather-${h}">
        <span class="weather-cell-inner">
          <span class="weather-cell-top">
            <span class="weather-icon">\u2013</span>
          </span>
        </span>
      </span>
      <span class="col-calendar" id="calendar-${h}">
        <span class="empty-slot">\u2014</span>
      </span>
    `;
    els.scheduleBody.appendChild(row);
  }
}

function scrollToNow() {
  const now = new Date().getHours();
  const row = document.getElementById(`row-${now}`);
  if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
}

els.dateLine.textContent = new Date().toLocaleDateString(undefined, {
  weekday: "long", month: "long", day: "numeric",
});

buildSkeleton();

// ---------------- Weather ----------------

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&hourly=temperature_2m,weathercode&temperature_unit=fahrenheit&timezone=auto&forecast_days=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Weather request failed");
  const data = await res.json();

  const times = data.hourly.time;       // ["2026-09-02T00:00", ...]
  const temps = data.hourly.temperature_2m;
  const codes = data.hourly.weathercode;

  state.weatherByHour = {};
  times.forEach((t, i) => {
    const h = Number(t.slice(11, 13));
    state.weatherByHour[h] = { temp: Math.round(temps[i]), code: codes[i] };
  });

  renderWeatherColumn();
}

function renderWeatherColumn() {
  for (let h = 0; h < 24; h++) {
    const cell = document.getElementById(`weather-${h}`);
    if (!cell) continue;
    const w = state.weatherByHour[h];
    if (!w) continue;
    const [icon, desc] = WMO[w.code] || ["\u2013", "Unknown"];
    cell.innerHTML = `
      <span class="weather-cell-inner">
        <span class="weather-cell-top">
          <span class="weather-icon">${icon}</span>
          <span class="weather-temp">${w.temp}\u00B0</span>
        </span>
        <span class="weather-desc">${desc}</span>
      </span>
    `;
  }
}

async function geocodePlace(query) {
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Location lookup failed");
  const data = await res.json();
  if (!data.results || !data.results.length) throw new Error("No matching place found");
  const r = data.results[0];
  return {
    latitude: r.latitude,
    longitude: r.longitude,
    name: [r.name, r.admin1, r.country].filter(Boolean).join(", "),
  };
}

async function useCoords(lat, lon, label) {
  state.latitude = lat;
  state.longitude = lon;
  state.placeName = label || null;
  setStatus(label ? `Loading weather for ${label}\u2026` : "Loading weather\u2026");
  try {
    await fetchWeather(lat, lon);
    setStatus(label ? `Showing weather for ${label}` : "");
  } catch (err) {
    setStatus("Couldn't load weather: " + err.message, true);
  }
}

function tryGeolocation() {
  if (!("geolocation" in navigator)) {
    promptForPlace();
    return;
  }
  setStatus("Finding your location\u2026");
  navigator.geolocation.getCurrentPosition(
    (pos) => useCoords(pos.coords.latitude, pos.coords.longitude, null),
    () => promptForPlace(),
    { timeout: 8000 }
  );
}

async function promptForPlace() {
  const q = window.prompt("City name (e.g. \"Port Huron, MI\")");
  if (!q) {
    setStatus("Location needed to show weather.", true);
    return;
  }
  setStatus(`Looking up ${q}\u2026`);
  try {
    const place = await geocodePlace(q);
    await useCoords(place.latitude, place.longitude, place.name);
  } catch (err) {
    setStatus("Couldn't find that place: " + err.message, true);
  }
}

els.locateBtn.addEventListener("click", promptForPlace);

// ---------------- Google Calendar ----------------

function initGoogle() {
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    // GIS script not ready yet — try again shortly.
    setTimeout(initGoogle, 300);
    return;
  }
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: CONFIG.GOOGLE_SCOPE,
    callback: (resp) => {
      if (resp.error) {
        setStatus("Calendar sign-in failed: " + resp.error, true);
        return;
      }
      state.accessToken = resp.access_token;
      els.signInBtn.textContent = "Refresh calendar";
      els.accountBadge.hidden = false;
      els.accountBadge.textContent = "Calendar connected";
      loadCalendarEvents();
    },
  });
}

els.signInBtn.addEventListener("click", () => {
  if (CONFIG.GOOGLE_CLIENT_ID.startsWith("YOUR_CLIENT_ID")) {
    setStatus("Add your Google Client ID in config.js first — see the comments in that file.", true);
    return;
  }
  if (!state.tokenClient) {
    setStatus("Still loading Google sign-in\u2026 try again in a second.", true);
    return;
  }
  state.tokenClient.requestAccessToken({ prompt: state.accessToken ? "" : "consent" });
});

async function loadCalendarEvents() {
  setStatus("Loading today's events\u2026");
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
  const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);

  const params = new URLSearchParams({
    timeMin: startOfDay.toISOString(),
    timeMax: endOfDay.toISOString(),
    singleEvents: "true",
    orderBy: "startTime",
    maxResults: "50",
  });

  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CONFIG.CALENDAR_ID)}/events?${params}`;

  try {
    const res = await fetch(url, {
      headers: { Authorization: `Bearer ${state.accessToken}` },
    });
    if (res.status === 401) {
      setStatus("Calendar session expired — click \"Refresh calendar\" to sign in again.", true);
      state.accessToken = null;
      els.signInBtn.textContent = "Connect calendar";
      return;
    }
    if (!res.ok) throw new Error(`Calendar request failed (${res.status})`);
    const data = await res.json();
    bucketEvents(data.items || []);
    renderCalendarColumn();
    setStatus("");
  } catch (err) {
    setStatus("Couldn't load calendar: " + err.message, true);
  }
}

function bucketEvents(items) {
  state.eventsByHour = {};
  state.allDayEvents = [];

  for (const ev of items) {
    const title = ev.summary || "(No title)";

    if (ev.start && ev.start.date && !ev.start.dateTime) {
      // all-day event
      state.allDayEvents.push(title);
      continue;
    }
    if (!ev.start || !ev.start.dateTime) continue;

    const start = new Date(ev.start.dateTime);
    const h = start.getHours();
    const timeLabel = start.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

    if (!state.eventsByHour[h]) state.eventsByHour[h] = [];
    state.eventsByHour[h].push({ title, timeLabel });
  }
}

function renderCalendarColumn() {
  for (let h = 0; h < 24; h++) {
    const cell = document.getElementById(`calendar-${h}`);
    if (!cell) continue;

    const items = state.eventsByHour[h] || [];
    const allDayHtml = h === 0
      ? state.allDayEvents.map(t => `<span class="event"><span class="event-time">All day</span><span class="event-title">${escapeHtml(t)}</span></span>`).join("")
      : "";

    if (!items.length && !allDayHtml) {
      cell.innerHTML = `<span class="empty-slot">\u2014</span>`;
      continue;
    }

    const eventsHtml = items
      .map(e => `<span class="event"><span class="event-time">${e.timeLabel}</span><span class="event-title">${escapeHtml(e.title)}</span></span>`)
      .join("");

    cell.innerHTML = allDayHtml + eventsHtml;
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// ---------------- Boot ----------------

initGoogle();
tryGeolocation();
setTimeout(scrollToNow, 400);

</script>
